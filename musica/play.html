<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reproductor - Varian Music</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="https://res.cloudinary.com/duwvw6q2c/image/upload/v1765742101/varian_lbd26r.webp" type="image/png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
body { 
  background: #0f0f0f;
  color: #fff; 
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
}

.floating-home-btn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 60px;
  height: 60px;
  background: #fff;
  color: #000;
  border: none;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  transition: all 0.3s ease;
  z-index: 9999;
}

.floating-home-btn:hover {
  transform: translateY(-5px);
}

/* VIDEO CONTAINER */
.video-container {
  background: #000;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
}

.video-wrapper {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%;
  background: #000;
}

.video-wrapper video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.video-info {
  padding: 20px;
  max-width: 1280px;
  margin: 0 auto;
}

.video-title {
  font-size: 20px;
  font-weight: 600;
  margin: 0 0 10px 0;
}

.video-description {
  background: #272727;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

.action-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 15px 0;
}

.btn-custom {
  padding: 10px 20px;
  border-radius: 20px;
  border: none;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}

.btn-back { background: #3a3a3a; color: #fff; }
.btn-switch { background: #34c759; color: #fff; }
.btn-share { background: #007aff; color: #fff; }

/* MUSIC PLAYER */
.music-container {
  max-width: 800px;
  margin: 20px auto;
  padding: 30px 20px;
}

.turntable-container {
  position: relative;
  width: 280px;
  height: 280px;
  margin: 0 auto 30px;
}

.turntable-base {
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #2a2a2a 0%, #1a1a1a 70%, #0a0a0a 100%);
  border-radius: 50%;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 40px rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
}

.vinyl-record {
  width: 240px;
  height: 240px;
  border-radius: 50%;
  position: relative;
  background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
}

.vinyl-record.playing {
  animation: rotate 4s linear infinite;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.album-cover {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #000;
}

.vinyl-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 40px;
  height: 40px;
  background: #333;
  border-radius: 50%;
}

.music-info {
  text-align: center;
  margin-bottom: 25px;
}

.music-title {
  font-size: 22px;
  font-weight: 600;
  margin: 0 0 8px 0;
}

.music-artist {
  color: #aaa;
  font-size: 16px;
  margin-bottom: 5px;
}

.music-genre {
  color: #888;
  font-size: 14px;
}

.progress-section {
  margin: 25px 0;
}

.progress-bar-custom {
  width: 100%;
  height: 5px;
  background: #3a3a3a;
  border-radius: 10px;
  cursor: pointer;
  margin-bottom: 8px;
}

.progress-fill {
  height: 100%;
  background: #fff;
  border-radius: 10px;
  width: 0%;
  transition: width 0.1s;
}

.time-display {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #aaa;
}

.controls-section {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 25px 0;
}

.control-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: #3a3a3a;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.control-btn:hover {
  background: #4a4a4a;
}

.control-btn.play-pause {
  width: 64px;
  height: 64px;
  font-size: 24px;
  background: #fff;
  color: #000;
}

.volume-section {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
  padding: 15px;
  background: #1a1a1a;
  border-radius: 12px;
}

.volume-slider {
  width: 120px;
  height: 5px;
  -webkit-appearance: none;
  background: #3a3a3a;
  border-radius: 5px;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  background: #fff;
  border-radius: 50%;
  cursor: pointer;
}

.volume-value {
  font-size: 13px;
  color: #aaa;
  min-width: 35px;
  text-align: right;
}
</style>
</head>
<body>

<button class="floating-home-btn" onclick="window.location.href='index.html'">
  <i class="bi bi-house-fill"></i>
</button>

<!-- VIDEO PLAYER -->
<div id="videoContainer" style="display:none;">
  <div class="video-container">
    <div class="video-wrapper">
      <video id="videoPlayer" controls autoplay></video>
    </div>
    <div class="video-info">
      <h1 class="video-title" id="videoTitle"></h1>
      <div class="video-description" id="videoDescription"></div>
      
      <div class="action-buttons">
        <button class="btn-custom btn-back" onclick="window.location.href='index.html'">
          <i class="bi bi-arrow-left"></i> Volver
        </button>
        <button class="btn-custom btn-switch" id="switchToMusic" style="display:none;">
          <i class="bi bi-music-note-beamed"></i> Escuchar música
        </button>
      </div>
    </div>
  </div>
</div>

<!-- MUSIC PLAYER -->
<div id="musicContainer" style="display:none;">
  <div class="music-container">
    <div class="turntable-container">
      <div class="turntable-base">
        <div class="vinyl-record" id="vinylRecord">
          <img id="albumCover" class="album-cover" src="" alt="Cover">
          <div class="vinyl-center"></div>
        </div>
      </div>
    </div>

    <div class="music-info">
      <h1 class="music-title" id="musicTitle"></h1>
      <p class="music-artist" id="musicArtist"></p>
      <p class="music-genre" id="musicGenre"></p>
    </div>

    <div class="progress-section">
      <div class="progress-bar-custom" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="controls-section">
      <button class="control-btn" id="btnPrev">
        <i class="bi bi-skip-start-fill"></i>
      </button>
      <button class="control-btn play-pause" id="btnPlayPause">
        <i class="bi bi-play-fill" id="playIcon"></i>
      </button>
      <button class="control-btn" id="btnNext">
        <i class="bi bi-skip-end-fill"></i>
      </button>
    </div>

    <div class="volume-section">
      <i class="bi bi-volume-up" style="color: #fff; font-size: 20px;"></i>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
      <span class="volume-value" id="volumeValue">100%</span>
    </div>

    <div class="action-buttons" style="margin-top: 25px;">
      <button class="btn-custom btn-back" onclick="window.location.href='index.html'">
        <i class="bi bi-arrow-left"></i> Volver
      </button>
      <button class="btn-custom btn-switch" id="switchToVideo" style="display:none;">
        <i class="bi bi-play-btn"></i> Ver video
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ==================== AUDIO PERSISTENTE ====================
class PersistentAudioPlayer {
  constructor() {
    // Intentar recuperar el audio del localStorage
    this.restoreAudio();
    
    this.currentVideo = null;
    this.allVideos = [];
    this.updateInterval = null;
    
    // Configurar Media Session
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => this.play());
      navigator.mediaSession.setActionHandler('pause', () => this.pause());
      navigator.mediaSession.setActionHandler('previoustrack', () => this.prev());
      navigator.mediaSession.setActionHandler('nexttrack', () => this.next());
      navigator.mediaSession.setActionHandler('seekto', (details) => {
        if (details.seekTime && this.audio) {
          this.audio.currentTime = details.seekTime;
        }
      });
    }
    
    // Guardar estado antes de salir
    window.addEventListener('beforeunload', () => this.saveState());
  }
  
  restoreAudio() {
    // Crear nuevo audio element
    this.audio = new Audio();
    this.audio.preload = 'metadata';
    
    // Intentar restaurar estado del localStorage
    const state = localStorage.getItem('musicState');
    if (state) {
      try {
        const data = JSON.parse(state);
        this.restoredState = data;
      } catch(e) {}
    }
  }
  
  init(video, videos) {
    this.currentVideo = video;
    this.allVideos = videos;
    
    const musicUrl = typeof video.musicas === 'string' ? video.musicas : video.musicas[0];
    
    // Si ya hay audio restaurado con el mismo src
    if (this.restoredState && this.restoredState.videoId === video.id) {
      this.audio.src = musicUrl;
      this.audio.load();
      
      this.audio.addEventListener('loadedmetadata', () => {
        this.audio.currentTime = this.restoredState.currentTime || 0;
        
        if (this.restoredState.isPlaying) {
          this.audio.play().catch(() => {});
        }
        
        this.updateUI();
        this.restoredState = null;
      }, { once: true });
    } else {
      // Nuevo audio
      this.audio.src = musicUrl;
      this.audio.load();
      this.audio.play().catch(() => {});
    }
    
    this.setupEventListeners();
    this.updateMediaSession();
    this.startUpdateInterval();
    this.saveState();
  }
  
  setupEventListeners() {
    this.audio.addEventListener('play', () => this.updatePlayState(true));
    this.audio.addEventListener('pause', () => this.updatePlayState(false));
    this.audio.addEventListener('ended', () => this.next());
    this.audio.addEventListener('timeupdate', () => this.updateTime());
  }
  
  startUpdateInterval() {
    if (this.updateInterval) clearInterval(this.updateInterval);
    
    this.updateInterval = setInterval(() => {
      this.updateProgress();
    }, 100);
  }
  
  updateUI() {
    const albumCover = document.getElementById('albumCover');
    const musicTitle = document.getElementById('musicTitle');
    const musicArtist = document.getElementById('musicArtist');
    const musicGenre = document.getElementById('musicGenre');
    const duration = document.getElementById('duration');
    
    if (albumCover) albumCover.src = this.currentVideo.thumbnail;
    if (musicTitle) musicTitle.textContent = this.currentVideo.titulo;
    if (musicArtist) musicArtist.textContent = this.currentVideo.artista || 'Artista desconocido';
    if (musicGenre) musicGenre.textContent = this.currentVideo.genero || '';
    
    if (duration && !isNaN(this.audio.duration)) {
      duration.textContent = this.formatTime(this.audio.duration);
    }
  }
  
  play() {
    if (this.audio) {
      this.audio.play().catch(() => {});
    }
  }
  
  pause() {
    if (this.audio) {
      this.audio.pause();
    }
  }
  
  togglePlay() {
    if (this.audio.paused) {
      this.play();
    } else {
      this.pause();
    }
  }
  
  next() {
    if (!this.currentVideo || !this.allVideos.length) return;
    
    const idx = this.allVideos.findIndex(v => v.id === this.currentVideo.id);
    const nextIdx = (idx + 1) % this.allVideos.length;
    const nextVideo = this.allVideos[nextIdx];
    
    this.init(nextVideo, this.allVideos);
    this.updateUI();
  }
  
  prev() {
    if (!this.currentVideo || !this.allVideos.length) return;
    
    const idx = this.allVideos.findIndex(v => v.id === this.currentVideo.id);
    const prevIdx = (idx - 1 + this.allVideos.length) % this.allVideos.length;
    const prevVideo = this.allVideos[prevIdx];
    
    this.init(prevVideo, this.allVideos);
    this.updateUI();
  }
  
  updatePlayState(playing) {
    const icon = document.getElementById('playIcon');
    const vinyl = document.getElementById('vinylRecord');
    
    if (icon) {
      icon.className = playing ? 'bi bi-pause-fill' : 'bi bi-play-fill';
    }
    
    if (vinyl) {
      vinyl.classList.toggle('playing', playing);
    }
  }
  
  updateTime() {
    if (!this.audio || isNaN(this.audio.duration)) return;
    
    const currentTime = document.getElementById('currentTime');
    if (currentTime) {
      currentTime.textContent = this.formatTime(this.audio.currentTime);
    }
    
    // Actualizar Media Session position
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.setPositionState({
          duration: this.audio.duration,
          playbackRate: this.audio.playbackRate,
          position: this.audio.currentTime
        });
      } catch(e) {}
    }
  }
  
  updateProgress() {
    if (!this.audio || isNaN(this.audio.duration)) return;
    
    const progressFill = document.getElementById('progressFill');
    if (progressFill) {
      const percent = (this.audio.currentTime / this.audio.duration) * 100;
      progressFill.style.width = percent + '%';
    }
    
    this.updatePlayState(!this.audio.paused);
  }
  
  seekTo(event) {
    const progressBar = document.getElementById('progressBar');
    const rect = progressBar.getBoundingClientRect();
    const percent = (event.clientX - rect.left) / rect.width;
    
    if (this.audio && !isNaN(this.audio.duration)) {
      this.audio.currentTime = percent * this.audio.duration;
    }
  }
  
  setVolume(value) {
    if (this.audio) {
      this.audio.volume = value / 100;
      const volumeValue = document.getElementById('volumeValue');
      if (volumeValue) {
        volumeValue.textContent = Math.round(value) + '%';
      }
    }
  }
  
  updateMediaSession() {
    if ('mediaSession' in navigator && this.currentVideo) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: this.currentVideo.titulo || 'Sin título',
        artist: this.currentVideo.artista || 'Artista desconocido',
        album: this.currentVideo.genero || 'Varian Music',
        artwork: [
          { src: this.currentVideo.thumbnail, sizes: '512x512', type: 'image/jpg' }
        ]
      });
    }
  }
  
  formatTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
  }
  
  saveState() {
    if (this.currentVideo && this.audio) {
      localStorage.setItem('musicState', JSON.stringify({
        videoId: this.currentVideo.id,
        currentTime: this.audio.currentTime || 0,
        isPlaying: !this.audio.paused
      }));
    }
  }
  
  destroy() {
    if (this.updateInterval) {
      clearInterval(this.updateInterval);
    }
  }
}

// Instancia del player
const player = new PersistentAudioPlayer();

// ==================== CARGAR CONTENIDO ====================
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const tipo = params.get('tipo') || 'video';

fetch('video.json')
  .then(res => res.json())
  .then(data => {
    const video = data.find(v => v.id === id);
    
    if (!video) {
      document.body.innerHTML = '<div style="text-align:center;padding:50px;"><p>Contenido no encontrado</p></div>';
      return;
    }
    
    if (tipo === 'video' && video.url) {
      // Mostrar video
      document.getElementById('videoContainer').style.display = 'block';
      document.getElementById('videoPlayer').src = video.url;
      document.getElementById('videoTitle').textContent = video.titulo;
      document.getElementById('videoDescription').textContent = video.descripcion || '';
      
      // Botón cambiar a música
      if (video.musicas) {
        const switchBtn = document.getElementById('switchToMusic');
        switchBtn.style.display = 'inline-flex';
        switchBtn.onclick = () => {
          window.location.href = `play.html?id=${video.id}&tipo=musica`;
        };
      }
      
    } else if (tipo === 'musica' && video.musicas) {
      // Mostrar reproductor de música
      document.getElementById('musicContainer').style.display = 'block';
      
      const musicVideos = data.filter(v => v.musicas);
      player.init(video, musicVideos);
      player.updateUI();
      
      // Botón cambiar a video
      if (video.url) {
        const switchBtn = document.getElementById('switchToVideo');
        switchBtn.style.display = 'inline-flex';
        switchBtn.onclick = () => {
          window.location.href = `play.html?id=${video.id}&tipo=video`;
        };
      }
      
      // Event listeners de controles
      document.getElementById('btnPlayPause').addEventListener('click', () => {
        player.togglePlay();
      });
      
      document.getElementById('btnNext').addEventListener('click', () => {
        player.next();
      });
      
      document.getElementById('btnPrev').addEventListener('click', () => {
        player.prev();
      });
      
      document.getElementById('progressBar').addEventListener('click', (e) => {
        player.seekTo(e);
      });
      
      document.getElementById('volumeSlider').addEventListener('input', (e) => {
        player.setVolume(e.target.value);
      });
    }
  })
  .catch(err => {
    console.error('Error:', err);
    document.body.innerHTML = '<div style="text-align:center;padding:50px;"><p>Error al cargar</p></div>';
  });

// Limpiar al salir
window.addEventListener('beforeunload', () => {
  player.destroy();
});
</script>
</body>
</html>
