<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador de JSON Musical Mejorado</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
  <h2 class="text-center mb-4">
    <i class="bi bi-music-note-list"></i> Formulario JSON de Música
  </h2>

  <!-- FORMULARIO -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form id="musicForm">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">ID</label>
            <input type="number" class="form-control" id="id" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Título</label>
            <input type="text" class="form-control" id="titulo" required>
          </div>

          <div class="col-md-12">
            <label class="form-label">Descripción</label>
            <input type="text" class="form-control" id="descripcion">
          </div>

          <div class="col-md-6">
            <label class="form-label">Artista</label>
            <input type="text" class="form-control" id="artista">
          </div>

          <div class="col-md-6">
            <label class="form-label">Género</label>
            <input type="text" class="form-control" id="genero">
          </div>

          <div class="col-md-12">
            <label class="form-label">URL Video (mp4)</label>
            <input type="url" class="form-control" id="url">
          </div>

          <div class="col-md-12">
            <label class="form-label">Thumbnail (imagen)</label>
            <input type="url" class="form-control" id="thumbnail">
          </div>

          <div class="col-md-12">
            <label class="form-label">URL Música (mp3)</label>
            <input type="url" class="form-control" id="musicas">
          </div>
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Agregar al JSON
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- RESULTADO JSON -->
  <div class="card shadow-sm">
    <div class="card-body">
      <h5><i class="bi bi-code-slash"></i> JSON generado</h5>

      <pre class="bg-dark text-light p-3 rounded" id="jsonOutput">[]</pre>

      <button class="btn btn-success mt-2" onclick="copiarJSON()">
        <i class="bi bi-clipboard"></i> Copiar JSON
      </button>
    </div>
  </div>
</div>

<script>
  let data = [];

  // Función para cargar un archivo JSON existente
  async function cargarJSON() {
    try {
      const response = await fetch('video.json'); // tu archivo JSON en GitHub Pages
      if (!response.ok) throw new Error("JSON no encontrado o vacío");
      const jsonData = await response.json();

      if (Array.isArray(jsonData)) {
        data = jsonData;
        // Ordenar por id ascendente si ya hay datos
        data.sort((a, b) => Number(a.id) - Number(b.id));
        actualizarSalida();
      } else {
        data = [];
      }
    } catch (err) {
      console.log("JSON vacío o no existe, comenzando con array vacío");
      data = [];
      actualizarSalida();
    }
  }

  // Llamar al cargar la página
  window.onload = cargarJSON;

  // Función para actualizar el JSON mostrado
  function actualizarSalida() {
    document.getElementById("jsonOutput").textContent = JSON.stringify(data, null, 2);
  }

  // Agregar nuevo registro
  document.getElementById("musicForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const nuevo = {
      id: document.getElementById("id").value,
      titulo: document.getElementById("titulo").value,
      descripcion: document.getElementById("descripcion").value,
      artista: document.getElementById("artista").value,
      url: document.getElementById("url").value,
      thumbnail: document.getElementById("thumbnail").value,
      genero: document.getElementById("genero").value,
      musicas: document.getElementById("musicas").value
    };

    data.push(nuevo);

    // Mantener orden por id
    data.sort((a, b) => Number(a.id) - Number(b.id));

    actualizarSalida();
    this.reset();
  });

  // Copiar JSON
  function copiarJSON() {
    navigator.clipboard.writeText(document.getElementById("jsonOutput").textContent);
    alert("JSON copiado correctamente");
  }
</script>

</body>
</html>
