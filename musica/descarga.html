<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instalar Varian PWA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #0f0f1a 100%);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .install-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 90%;
        }
        .app-logo {
            width: 120px;
            height: 120px;
            border-radius: 25%;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        #btnInstalar {
            display: none; /* Se muestra solo si la PWA es instalable */
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 50px;
            transition: transform 0.2s;
        }
        #btnInstalar:hover {
            transform: scale(1.05);
        }
        .status-msg {
            font-size: 0.9rem;
            color: #ccc;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="install-card">
        <img src="https://res.cloudinary.com/duwvw6q2c/image/upload/v1765742101/varian_lbd26r.webp" alt="Varian Logo" class="app-logo">
        <h1 class="h3 mb-3">Varian PWA</h1>
        <p class="mb-4">Instala nuestra aplicación para disfrutar de la mejor música sin interrupciones y acceso rápido.</p>
        
        <button id="btnInstalar" class="btn btn-primary btn-lg w-100">
            <i class="bi bi-download me-2"></i> INSTALAR APP
        </button>

        <div id="msgSoporte" class="status-msg">
            Preparando instalación...
        </div>
        
        <a href="index.html" class="btn btn-link text-white-50 mt-3 text-decoration-none">
            <i class="bi bi-arrow-left"></i> Volver al inicio
        </a>
    </div>

    <script>
        let deferredPrompt;
        const btnInstalar = document.getElementById('btnInstalar');
        const msgSoporte = document.getElementById('msgSoporte');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevenir que el navegador muestre el prompt automático
            e.preventDefault();
            deferredPrompt = e;
            // Mostrar nuestro botón personalizado
            btnInstalar.style.display = 'block';
            msgSoporte.style.display = 'none';
        });

        btnInstalar.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('El usuario aceptó la instalación');
                }
                deferredPrompt = null;
                btnInstalar.style.display = 'none';
            }
        });

        window.addEventListener('appinstalled', () => {
            msgSoporte.innerText = "¡App instalada correctamente!";
            msgSoporte.style.display = 'block';
            btnInstalar.style.display = 'none';
        });

        // Verificar si ya está instalada o no es compatible
        setTimeout(() => {
            if (!deferredPrompt) {
                msgSoporte.innerHTML = "Si no ves el botón, busca 'Instalar aplicación' en el menú de tu navegador.";
            }
        }, 3000);
    </script>
</body>
</html>
