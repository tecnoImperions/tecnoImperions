<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>VARIAN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #splash::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("https://res.cloudinary.com/duwvw6q2c/image/upload/v1765742101/varian_lbd26r.webp")
        center / cover no-repeat;
      animation: zoom 4s ease forwards;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,.85),
        rgba(0,0,0,.4)
      );
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      color: white;
    }

    .logo {
      font-size: clamp(3rem, 7vw, 5rem);
      letter-spacing: 8px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .icons {
      display: flex;
      gap: 25px;
      justify-content: center;
      font-size: 2rem;
      opacity: .85;
    }

    .icons i {
      animation: pulse 1.5s infinite ease-in-out;
    }

    .icons i:nth-child(2) { animation-delay: .3s; }
    .icons i:nth-child(3) { animation-delay: .6s; }
    .icons i:nth-child(4) { animation-delay: .9s; }

    @keyframes zoom {
      from { transform: scale(1.3); }
      to { transform: scale(1); }
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); opacity:.6 }
      50% { transform: scale(1.3); opacity:1 }
    }
  </style>
</head>

<body>

  <div id="splash">
    <div id="overlay"></div>

    <div class="content">
      <div class="logo">VARIAN</div>
      <div class="icons">
        <i class="bi bi-play-circle-fill"></i>
        <i class="bi bi-music-note-beamed"></i>
        <i class="bi bi-collection-play-fill"></i>
        <i class="bi bi-cast"></i>
      </div>
    </div>
  </div>

    <script>
    function detectarDispositivo() {
        const width = window.innerWidth;
        const ua = navigator.userAgent.toLowerCase();

        // 📺 SMART TV
        if (
            ua.includes("smart-tv") ||
            ua.includes("smarttv") ||
            ua.includes("tizen") ||
            ua.includes("webos") ||
            ua.includes("android tv") ||
            ua.includes("hbbtv")
        ) {
            return "/productos/video/TV/index.html";
        }

        // 📱 CELULAR / TABLET
        if (
            ua.includes("mobile") ||
            ua.includes("android") ||
            ua.includes("iphone") ||
            ua.includes("ipad") ||
            width <= 900
        ) {
            return "/productos/video/CEL/index.html";
        }

        // 💻 PC / LAPTOP (DEFAULT)
        return "/productos/video/PC/index.html";
    }

    // ⏱️ duración de la intro
    setTimeout(() => {
        window.location.href = detectarDispositivo();
    }, 5500);
    </script>



</body>
</html>
